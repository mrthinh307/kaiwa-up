name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy, and smoke test
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy_web.outputs.url }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Validate deployment configuration
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for variable in \
            BACKEND_URL \
            NEON_MIGRATION_DATABASE_URL \
            RENDER_DEPLOY_HOOK_URL \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            VERCEL_TOKEN; do
            if [ -z "${!variable}" ]; then
              echo "Missing required deployment configuration: ${variable}" >&2
              exit 1
            fi
          done

      - name: Install backend dependencies
        run: uv --directory apps/api sync --locked

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
        run: uv --directory apps/api run alembic upgrade head

      - name: Trigger the tested backend commit on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: >-
          curl --fail --silent --show-error --request POST
          "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_SHA}"

      - name: Wait for backend readiness and matching release
        run: |
          for attempt in {1..90}; do
            payload="$(curl --fail --silent --show-error "${BACKEND_URL}/api/v1/ready" || true)"
            if jq --exit-status --arg sha "${DEPLOY_SHA}" \
              '.status == "ready" and .database == "ok" and .release_sha == $sha' \
              <<<"${payload}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not become ready with release ${DEPLOY_SHA}" >&2
          exit 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@59.4.0 pull --yes --environment=production
          --token="${VERCEL_TOKEN}"

      - name: Build the Vercel production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@59.4.0 build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy frontend to Vercel
        id: deploy_web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@59.4.0 deploy --prebuilt --prod --token="${VERCEL_TOKEN}")"
          echo "url=${deployment_url}" >>"${GITHUB_OUTPUT}"

      - name: Smoke test frontend and same-origin API proxy
        env:
          FRONTEND_URL: ${{ steps.deploy_web.outputs.url }}
        run: |
          curl --fail --silent --show-error --location "${FRONTEND_URL}/login" >/dev/null
          status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "${FRONTEND_URL}/api/v1/auth/refresh")"
          test "${status_code}" = "401"
