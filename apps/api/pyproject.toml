[project]
name = "kaiwa-api"
version = "0.1.0"
description = "FastAPI backend for Kaiwa App"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.30,<1",
    "email-validator>=2.3.0",
    "fastapi>=0.116,<1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "uvicorn[standard]>=0.35,<1",
    "youtube-transcript-api>=1.2,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-xdist>=3.8,<4",
    "python-dotenv>=1.2.2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
